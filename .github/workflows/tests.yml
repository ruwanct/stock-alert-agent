name: Tests

on:
  push:
    paths-ignore:
      - 'memory/**'
  pull_request:
    paths-ignore:
      - 'memory/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Tests use mocks only: no secrets, and Mongo/dry-run settings forced to "unset".
      MONGODB_URI: ""
      DRY_RUN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
