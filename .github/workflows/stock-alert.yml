name: Stock Alert Bot

on:
  # Runs 3x daily on weekdays (Mon-Fri)
  # Times in UTC → Berlin is UTC+1 (winter) / UTC+2 (summer)
  # 06:00 UTC = 08:00 Berlin (summer) / 07:00 Berlin (winter)
  # 10:00 UTC = 12:00 Berlin (summer) / 11:00 Berlin (winter)
  # 15:00 UTC = 17:00 Berlin (summer) / 16:00 Berlin (winter)
  schedule:
    - cron: '0 6 * * 1-5'   # Morning alert
    - cron: '0 10 * * 1-5'  # Midday alert
    - cron: '0 15 * * 1-5'  # Evening alert

  # Manual trigger — click "Run workflow" in GitHub to test anytime
  workflow_dispatch:

# Needed so the job can commit memory/ back to main
permissions:
  contents: write

# Never run two jobs at once — they would race on memory/
concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock alert bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional LangSmith tracing (leave the secret unset to disable)
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' && 'true' || 'false' }}
          LANGSMITH_PROJECT: stock-alert-bot
        run: python stock_alert_bot.py

      - name: Commit memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898708+github-actions[bot]@users.noreply.github.com"
          git add memory/
          git diff --cached --quiet || (git commit -m "chore(memory): update bot memory [skip ci]" && git pull --rebase && git push)
